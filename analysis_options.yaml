# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Generated and throwaway files should not block analysis.
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "scratch/**"
  errors:
    # Demote to info so they don't block CI; still visible in IDE.
    use_build_context_synchronously: info
    unawaited_futures: info
    unawaited_return_in_try_block: info

linter:
  rules:
    # Catch un-awaited futures that can swallow errors or cause races.
    # These are surfaced as warnings (see analyzer.errors above) because they
    # are a common source of silent failures.
    unawaited_futures: true
    # Avoid stray prints in production code.
    avoid_print: true
    # NOTE: prefer_const_constructors / prefer_const_declarations are valuable
    # for rebuild performance but currently produce a large backlog. Enable
    # them and fix incrementally rather than all at once:
    # prefer_const_constructors: true
    # prefer_const_declarations: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
