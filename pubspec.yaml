name: instiy
description: "Student marketplace for buying and selling products."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI Components
  shadcn_ui: ^0.56.1
  google_fonts: ^8.1.0
  # Animation effects (re-exported by shadcn_ui; declared directly so the
  # `Effect` type can be imported for shared dropdown/popover animations).
  flutter_animate: ^4.5.2

  # Supabase
  supabase_flutter: ^2.8.0

  # Google Sign-In (native)
  google_sign_in: ^7.2.0

  # Image handling
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  cached_network_image: ^3.4.1
  image: ^4.3.0
  photo_view: ^0.15.0

  # GIF & Sticker support
  giphy_get: ^3.5.0

  # Video playback
  video_player: ^2.9.1

  # Video compression
  video_compress: 3.1.4

  # HTTP client for R2 uploads
  http: ^1.2.2

  # State management
  flutter_riverpod: ^3.3.1

  # Local storage
  shared_preferences: ^2.5.3

  # UUID generation
  uuid: ^4.5.1
  crypto: ^3.0.3

  # Intl for date formatting
  intl: ^0.20.2
  paystack_flutter_sdk: 0.0.1-alpha.2

  # QR code generation
  qr_flutter: ^4.1.0

  # QR code / barcode scanning
  mobile_scanner: ^7.4.0
  app_links: ^7.1.1

  # Markdown rendering
  flutter_markdown_plus: ^1.0.7

  # SVG rendering
  flutter_svg: ^2.0.16

  # Lottie animations

  # Biometric / screen lock authentication
  local_auth: ^3.0.1

  # Local device notifications
  flutter_local_notifications: ^22.3.0

  # Audio playback for in-app notification sounds
  audioplayers: ^6.7.1

  # Video trimming
  # URL launching (phone, WhatsApp, etc.)
  url_launcher: ^6.3.1
  flutter_linkify: ^6.0.0

  # Temporary file paths
  path_provider: ^2.1.5
  gal: ^2.3.2
  record: ^7.0.0
  permission_handler: ^12.0.2
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  firebase_crashlytics: ^5.2.7
  sqflite: ^2.4.3
  path: ^1.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  riverpod_annotation: ^4.0.2

  provider: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3

dependency_overrides:
  dbus: 0.7.13
  matcher: 0.12.20
  meta: 1.18.2
  test_api: 0.7.12
  # test_core 0.6.19 requires test_api 0.7.13 (Declarer/Invoker); the
  # test_api override above pins 0.7.12, so keep the matching 0.6.18.
  test_core: 0.6.18
  vector_math: 2.3.0
  xml: 7.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/logo.svg
    - assets/logo_highres.png
    - assets/splash_logo.png
    - assets/splash_logo_android12.png
    - assets/badge-check-svgrepo-com.svg
    - assets/whatsapp-svgrepo-com.svg
    - assets/facebook-svgrepo-com.svg
    - assets/instagram-svgrepo-com.svg
    - assets/x.png
    - assets/notification_icons/
    - assets/sounds/
    - assets/bank_logos/
    - assets/mobile-network/
